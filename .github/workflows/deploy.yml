name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/retire-adventure-pwa-qf4tea]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken plan is worse than no plan, so the deploy is gated on the
      # engine tests rather than just on the build succeeding.
      - run: npm test

      - run: npm run build

      # Creates the Pages site if the repository does not have one yet, so a
      # fresh clone of this repo deploys without anyone visiting Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Diagnostic: the deploy job is being rejected before a runner picks it
      # up, which produces no logs. Print what the API actually says about the
      # Pages site and the github-pages environment.
      - name: Report Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- repo ---"
          gh api "repos/$GITHUB_REPOSITORY" --jq '{default_branch, has_pages, visibility}' || true
          echo "--- pages ---"
          gh api "repos/$GITHUB_REPOSITORY/pages" || true
          echo "--- environment ---"
          gh api "repos/$GITHUB_REPOSITORY/environments/github-pages" || true
          echo "--- branch policies ---"
          gh api "repos/$GITHUB_REPOSITORY/environments/github-pages/deployment-branch-policies" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
